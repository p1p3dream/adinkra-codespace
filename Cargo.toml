[package]
name = "adinkra-codespace"
version = "0.1.0"
edition = "2024"

[features]
default = []
cuda = []

[dependencies]
matrixmultiply = { version = "0.3", features = ["threading"] }
nauty-pet = "0.14"
petgraph = "0.8"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zstd = "0.13"
num-complex = "0.4"
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2"
