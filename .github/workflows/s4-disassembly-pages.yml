name: Publish S4 disassembly page

# Manual only. The workflow publishes an isolated site artifact, not the repo.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate Chrome
        shell: bash
        run: |
          chrome="$(command -v google-chrome || command -v google-chrome-stable || true)"
          test -n "$chrome"
          echo "CHROME=$chrome" >> "$GITHUB_ENV"
      - name: Build and verify
        run: |
          node visualizer/build_permutahedron_s4_disassembly.mjs
          git diff --exit-code -- visualizer/permutahedron_s4_disassembly.html
          node visualizer/verify_permutahedron_s4_disassembly.mjs
          visualizer/mutation_test_permutahedron_s4_data.sh
          visualizer/smoke_permutahedron_s4_disassembly.sh
          visualizer/check_permutahedron_s4_controls.sh
          visualizer/check_permutahedron_s4_popout.sh
          visualizer/mutation_test_permutahedron_s4_orientation.sh
      - name: Assemble isolated site
        run: |
          mkdir _site
          cp visualizer/permutahedron_s4_disassembly.html _site/index.html
          cp visualizer/permutahedron_s4_disassembly.html _site/permutahedron_s4_disassembly.html
          cp visualizer/permutahedron_s4_explorer.html _site/permutahedron_s4_explorer.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy isolated site
        id: deployment
        uses: actions/deploy-pages@v4
