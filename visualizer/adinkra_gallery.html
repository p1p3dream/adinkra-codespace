<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Adinkra Visualization Gallery</title>
<style>
body{margin:0;background:#0b1020;color:#e5e7eb;font-family:Inter,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif}
header{position:sticky;top:0;background:rgba(11,16,32,.94);backdrop-filter:blur(12px);padding:18px 24px;border-bottom:1px solid #1f2937;z-index:5}
h1{margin:0 0 6px;font-size:22px}.sub{color:#9ca3af;font-size:13px}.sub a,.card a{color:#93c5fd;text-decoration:none}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:18px;padding:24px}.group-title{grid-column:1/-1;margin:14px 0 0;padding-bottom:8px;border-bottom:1px solid #334155;font-size:18px;color:#f8fafc}
.card{background:#111827;border:1px solid #263244;border-radius:14px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.25)}
.card h2{font-size:14px;margin:0;padding:11px 14px;border-bottom:1px solid #263244;color:#f9fafb}.card img{display:block;width:100%;height:auto;background:#050816;cursor:zoom-in}
.viewer{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;z-index:20;padding:24px}.viewer img{max-width:96vw;max-height:92vh;object-fit:contain}.viewer.show{display:flex}.hint{position:fixed;bottom:12px;color:#aaa;font-size:12px}
</style></head><body>
<header><h1>Adinkra visualization gallery</h1><div class="sub"><span id="count">42</span> checked-in figures from the complete Rust source dataset and the stated figure-specific scopes. <a href="adinkra_catalog_3d.html#code=75&dashing=0">Open the catalog-wide 3D viewer.</a></div></header>
<main class="grid" id="grid"></main><div class="viewer" id="viewer"><img id="big" alt="Expanded figure"><div class="hint">click or press Esc to close</div></div>
<script>
const GROUPS=[
  {
    "title": "Three-dimensional graph renders",
    "files": [
      "adinkra_3d_n16_d16.png",
      "adinkra_3d_n16_d16_e10_a0.png",
      "adinkra_3d_n16_d16_e45_a90.png",
      "adinkra_3d_n16_d16_e80_a180.png",
      "adinkra_3d_n16_e8xe8.png",
      "adinkra_3d_n16_e8xe8_e10_a0.png",
      "adinkra_3d_n16_e8xe8_e45_a90.png",
      "adinkra_3d_n16_e8xe8_e80_a180.png",
      "adinkra_3d_n4.png",
      "adinkra_3d_n8.png"
    ]
  },
  {
    "title": "Gadget figures",
    "files": [
      "gadget_cdf.png",
      "gadget_discrete_values.png",
      "gadget_heatmap_k1.png",
      "gadget_heatmap_k2.png",
      "gadget_heatmap_k3.png",
      "gadget_heatmap_k4.png",
      "gadget_heatmap_k5.png",
      "gadget_heatmap_k6.png",
      "gadget_heatmap_k7.png",
      "gadget_heatmap_k8.png",
      "gadget_heatmaps_combined.png",
      "gadget_intra_vs_inter.png",
      "gadget_ridge_plot.png",
      "gadget_stats_table.png"
    ]
  },
  {
    "title": "Spectral and rank figures",
    "files": [
      "eigenvalue_histograms.png",
      "eigenvalue_spectra_by_k.png",
      "eigenvalue_waterfall.png",
      "rank_nullity.png"
    ]
  },
  {
    "title": "Code comparison and clustering",
    "files": [
      "all_codes_landscape.png",
      "code_dendrogram.png",
      "code_network_by_stratum.png",
      "code_similarity_k4.png"
    ]
  },
  {
    "title": "Diffusion maps",
    "files": [
      "diffusion_2d_by_stratum.png",
      "diffusion_3d_k6.png",
      "diffusion_distance_k6.png"
    ]
  },
  {
    "title": "Catalog and scaling summaries",
    "files": [
      "panel_codes_per_stratum.png",
      "panel_computation_summary.png",
      "panel_dimension_scaling.png",
      "panel_matrix_sizes.png",
      "panel_reps_per_stratum.png",
      "panel_self_gadget_values.png",
      "strata_dashboard.png"
    ]
  }
];
const grid=document.getElementById('grid');
const pretty=name=>name.replace(/\.png$/,'').replaceAll('_',' ');
let count=0;
for(const group of GROUPS){const heading=document.createElement('h2');heading.className='group-title';heading.textContent=`${group.title} (${group.files.length})`;grid.appendChild(heading);for(const file of group.files){count++;const section=document.createElement('section');section.className='card';const href=`../viz/${file}`;section.innerHTML=`<h2><a href="${href}" target="_blank">${pretty(file)}</a></h2><img src="${href}" alt="${pretty(file)}" loading="lazy">`;grid.appendChild(section)}}
document.getElementById('count').textContent=count;
const viewer=document.getElementById('viewer'),big=document.getElementById('big');
document.querySelectorAll('.card img').forEach(img=>img.onclick=()=>{big.src=img.src;viewer.classList.add('show')});viewer.onclick=()=>viewer.classList.remove('show');document.addEventListener('keydown',e=>{if(e.key==='Escape')viewer.classList.remove('show')});
</script></body></html>
